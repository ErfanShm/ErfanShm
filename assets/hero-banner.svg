<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Erfan Shafiee Moghaddam  AI Systems Architect">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0d"/>
      <stop offset="55%" stop-color="#0d1512"/>
      <stop offset="100%" stop-color="#101a16"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#3dd68c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3dd68c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dd68c"/>
      <stop offset="100%" stop-color="#7ee0b0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="48" y="48" width="1104" height="324" rx="18"/>
    </clipPath>
  </defs>

  <!-- Atmosphere -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="180" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="340" r="140" fill="#3dd68c" opacity="0.05">
    <animate attributeName="r" values="130;155;130" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid -->
  <g opacity="0.08" stroke="#3dd68c" stroke-width="1">
    <path d="M0 80 H1200 M0 140 H1200 M0 200 H1200 M0 260 H1200 M0 320 H1200 M0 380 H1200"/>
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420"/>
  </g>

  <!-- Terminal chrome -->
  <rect x="48" y="48" width="1104" height="324" rx="18" fill="#0b1210" stroke="#1f3a2e" stroke-width="1.5"/>
  <rect x="48" y="48" width="1104" height="46" rx="18" fill="#0f1a16"/>
  <rect x="48" y="76" width="1104" height="18" fill="#0f1a16"/>

  <circle cx="78" cy="71" r="7" fill="#ff5f56"/>
  <circle cx="102" cy="71" r="7" fill="#ffbd2e"/>
  <circle cx="126" cy="71" r="7" fill="#27c93f"/>

  <text x="600" y="76" text-anchor="middle" fill="#6b8f7c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    erfanshm  zsh@portfolio  zsh
  </text>

  <!-- Terminal body -->
  <g clip-path="url(#frame)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="80" y="140" fill="#6b8f7c" font-size="16">~/evening</text>

    <text x="80" y="178" fill="#3dd68c" font-size="18" font-weight="700">$</text>
    <text x="104" y="178" fill="#e8f5ee" font-size="18">./build_ai_product.sh --scale "enterprise"</text>
    <rect x="520" y="162" width="10" height="20" fill="#3dd68c">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="80" y="230" fill="#e8f5ee" font-size="36" font-weight="700" filter="url(#softGlow)">
      Erfan Shafiee Moghaddam
    </text>

    <text x="80" y="272" fill="url(#accent)" font-size="22" font-weight="600">
      AI Systems Architect
    </text>

    <text x="80" y="310" fill="#8fb59f" font-size="15">
      Enterprise AI  ·  Multi-Agent Systems  ·  Production RAG
    </text>

    <!-- Status chips -->
    <g>
      <rect x="80" y="330" width="168" height="28" rx="8" fill="#12241c" stroke="#274636"/>
      <circle cx="98" cy="344" r="4" fill="#3dd68c">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="112" y="348" fill="#b7dcc7" font-size="12">Open to work</text>

      <rect x="260" y="330" width="210" height="28" rx="8" fill="#12241c" stroke="#274636"/>
      <text x="276" y="348" fill="#b7dcc7" font-size="12">erfanshm.com</text>

      <rect x="482" y="330" width="250" height="28" rx="8" fill="#12241c" stroke="#274636"/>
      <text x="498" y="348" fill="#b7dcc7" font-size="12">Tehran · Hybrid · Remote</text>
    </g>
  </g>

  <!-- Scan line -->
  <rect x="48" y="48" width="1104" height="2" fill="#3dd68c" opacity="0.25">
    <animate attributeName="y" values="48;370;48" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280">
  <!-- Quiet HUD hero — cyan #00d4ff, subtle grid -->
  <rect width="1100" height="280" fill="#0b1218"/>
  <g stroke="#1a2a38" stroke-width="1" opacity="0.55">
    <path d="M0 40H1100M0 80H1100M0 120H1100M0 160H1100M0 200H1100M0 240H1100"/>
    <path d="M80 0V280M160 0V280M240 0V280M320 0V280M400 0V280M480 0V280M560 0V280M640 0V280M720 0V280M800 0V280M880 0V280M960 0V280M1040 0V280"/>
  </g>

  <!-- soft left rail -->
  <rect x="0" y="0" width="3" height="280" fill="#00d4ff" opacity="0.85"/>

  <!-- main panel -->
  <rect x="36" y="36" width="1028" height="208" rx="4" fill="#0e1620" stroke="#243040" stroke-width="1"/>
  <!-- L-corner accent (light cyberpunk cue) -->
  <path d="M36 56 V36 H56" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <path d="M1064 36 H1044 V56" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.45"/>
  <path d="M36 224 V244 H56" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.45"/>

  <text x="64" y="78" fill="#5a6a7a" font-family="Consolas, Menlo, monospace" font-size="12">ERFANSHM / CONSOLE</text>
  <text x="64" y="118" fill="#e8eef4" font-family="Consolas, Menlo, monospace" font-size="28" font-weight="700">Erfan Shafiee Moghaddam</text>
  <text x="64" y="152" fill="#00d4ff" font-family="Consolas, Menlo, monospace" font-size="16">AI Systems Architect</text>
  <text x="64" y="184" fill="#8a9aaa" font-family="Consolas, Menlo, monospace" font-size="13">Enterprise AI  ·  Multi-Agent  ·  Production RAG</text>

  <rect x="64" y="204" width="118" height="22" rx="3" fill="#121c28" stroke="#2a3a4a"/>
  <circle cx="78" cy="215" r="3" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="90" y="219" fill="#9ab0c0" font-family="Consolas, Menlo, monospace" font-size="11">open to work</text>
  <text x="200" y="219" fill="#5a6a7a" font-family="Consolas, Menlo, monospace" font-size="11">erfanshm.com  ·  Tehran</text>
</svg>

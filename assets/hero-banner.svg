<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <!-- Brand cyan #06b6d4 — GitHub-safe (no style/filter/foreignObject) -->
  <rect width="1200" height="420" fill="#020617"/>
  <rect x="0" y="0" width="1200" height="420" fill="#083344" opacity="0.35"/>
  <circle cx="980" cy="80" r="200" fill="#06b6d4" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="340" r="140" fill="#06b6d4" opacity="0.06"/>

  <!-- soft grid -->
  <g stroke="#06b6d4" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 90H1200M0 150H1200M0 210H1200M0 270H1200M0 330H1200M0 390H1200"/>
    <path d="M150 0V420M300 0V420M450 0V420M600 0V420M750 0V420M900 0V420M1050 0V420"/>
  </g>

  <!-- terminal window -->
  <rect x="48" y="48" width="1104" height="324" rx="18" fill="#0b1220" stroke="#164e63" stroke-width="2"/>
  <rect x="48" y="48" width="1104" height="48" rx="18" fill="#0f172a"/>
  <rect x="48" y="78" width="1104" height="18" fill="#0f172a"/>

  <circle cx="78" cy="72" r="7" fill="#ff5f56"/>
  <circle cx="102" cy="72" r="7" fill="#ffbd2e"/>
  <circle cx="126" cy="72" r="7" fill="#27c93f"/>

  <text x="600" y="77" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">erfanshm — zsh@portfolio — zsh</text>

  <text x="80" y="140" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">~/evening</text>

  <text x="80" y="178" fill="#06b6d4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">$</text>
  <text x="104" y="178" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">./build_ai_product.sh --scale "enterprise"</text>
  <rect x="548" y="162" width="10" height="20" fill="#06b6d4">
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>

  <text x="80" y="232" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700">Erfan Shafiee Moghaddam</text>
  <text x="80" y="274" fill="#06b6d4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">AI Systems Architect</text>
  <text x="80" y="312" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Enterprise AI  ·  Multi-Agent Systems  ·  Production RAG</text>

  <rect x="80" y="332" width="168" height="28" rx="8" fill="#083344" stroke="#164e63"/>
  <circle cx="98" cy="346" r="4" fill="#06b6d4">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="112" y="350" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Open to work</text>

  <rect x="260" y="332" width="190" height="28" rx="8" fill="#083344" stroke="#164e63"/>
  <text x="276" y="350" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">erfanshm.com</text>

  <rect x="462" y="332" width="250" height="28" rx="8" fill="#083344" stroke="#164e63"/>
  <text x="478" y="350" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Tehran · Hybrid · Remote</text>

  <rect x="48" y="48" width="1104" height="2" fill="#06b6d4" opacity="0.35">
    <animate attributeName="y" values="48;370;48" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="7s" repeatCount="indefinite"/>

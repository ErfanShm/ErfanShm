<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220">
  <!-- Compact session — fewer lines, cyan accent -->
  <rect width="1100" height="220" fill="#0b1218"/>
  <rect x="36" y="24" width="1028" height="172" rx="4" fill="#0e1620" stroke="#243040"/>
  <path d="M36 44 V24 H56" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <rect x="0" y="24" width="3" height="172" fill="#00d4ff" opacity="0.7"/>

  <text x="64" y="52" fill="#5a6a7a" font-family="Consolas, Menlo, monospace" font-size="11">session.exe</text>

  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <g>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="8s" repeatCount="indefinite"/>
      <text x="64" y="88" fill="#00d4ff">$</text>
      <text x="86" y="88" fill="#d0dae4">whoami --product</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.26;1" dur="8s" repeatCount="indefinite"/>
      <text x="64" y="116" fill="#9ab0c0">AI Systems Architect | Production RAG | Multi-Agent</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.48;1" dur="8s" repeatCount="indefinite"/>
      <text x="64" y="152" fill="#00d4ff">$</text>
      <text x="86" y="152" fill="#d0dae4">./build_ai_product.sh --scale enterprise</text>
      <rect x="470" y="138" width="8" height="16" fill="#00d4ff">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.66;1" dur="8s" repeatCount="indefinite"/>
      <text x="64" y="180" fill="#6a8090">ok  UGAP · UTEX · KNIGHT</text>
    </g>
  </g>
</svg>

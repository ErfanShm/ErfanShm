<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dd68c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3dd68c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3dd68c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="13" width="820" height="2" rx="1" fill="url(#line)"/>
  <circle cx="450" cy="14" r="4" fill="#3dd68c">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="14" r="8" fill="none" stroke="#3dd68c" stroke-opacity="0.35">
    <animate attributeName="r" values="6;12;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>

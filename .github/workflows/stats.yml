name: Update README stats cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GITHUB_TOKEN alone fails with "Resource not accessible by integration"
      # when include_all_commits / private data is requested. Prefer PAT secret
      # named GH_STATS_TOKEN (classic: public_repo + read:user). Falls back to GITHUB_TOKEN.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&title_color=3dd68c&icon_color=3dd68c&text_color=c9d1d9&bg_color=0b1210&ring_color=3dd68c&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: false

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=dark&title_color=3dd68c&text_color=c9d1d9&bg_color=0b1210&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: false

      - name: Commit cards
        run: |
          if grep -q "Something went wrong" profile/stats.svg profile/top-langs.svg 2>/dev/null; then
            echo "Stats API returned an error card — keeping previous SVGs"
            git checkout -- profile/stats.svg profile/top-langs.svg || true
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p profile
          git add profile/*.svg
          git commit -m "chore: refresh GitHub stats cards" || exit 0
          git push
